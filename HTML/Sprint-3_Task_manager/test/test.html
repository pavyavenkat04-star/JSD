<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Manager Unit Tests</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f5f5;
            color: #263238;
        }

        h1 {
            color: #263238;
        }

        #summary {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 5px;
        }

        .test {
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-radius: 5px;
            border-left: 5px solid #ccc;
        }

        .pass {
            color: green;
        }

        .fail {
            color: red;
        }

        .test-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .details {
            font-size: 14px;
            color: #555;
        }

    </style>

</head>

<body>

    <h1>Task Manager Unit Tests</h1>

    <div id="summary"></div>

    <div id="results"></div>


    <script src="../app.js"></script>

    <script src="tests.js"></script>

</body>

</html>
