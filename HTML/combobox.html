<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combobox</title>
</head>
<body>
    <form>
        <label>Select month</label>
        <select>
            <option>Jan</option>
             <option>Feb</option>
              <option>Mar</option>
               <option>Apr</option>
                <option>May</option>
                 <option>Jun</option>
        </select><br>
        <label>Select DOB</label>
        <input type="date" name="d1">
        <br>
        <label>Select TOB</label>
        <input type="time" name="t1">
        <br>
        <label>Upload your resume</label>
        <input type="file" name="f1"><br>
        <iframe width="500" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15675.184893885018!2d78.68293493209889!3d10.826900905079333!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3baaf5afc9ad416b%3A0x822886cc60a5eadb!2sTheppakulam%2C%20Tamil%20Nadu%20620002!5e0!3m2!1sen!2sin!4v1785915951039!5m2!1sen!2sin width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
         <br>
        <input type="reset" value="clear">
        <button>Click</button>
    </form>
</body>
</html>
