
<!DOCTYPE html>
<html>
<head>
    <title>Column Grid</title>

    <style>
        body {
            font-family: Arial;
        }

        .controls {
            text-align: center;
            margin: 20px;
        }

        button, input {
            padding: 8px;
            margin: 5px;
        }
        #grid {
            display: grid;
            gap: 10px;
            margin: 20px;
        }
        .column {
            padding: 30px;
            min-height: 150px;
            background: lightblue;
            border: 2px solid gray;
        }
        .edit {
            display: none;
        }
        .show {
            display: block;
        }
    </style>
</head>
<body>
    <h1 align="center">Column Grid</h1>
    <div class="controls">
        <label>Columns:</label>
        <input type="number" id="count" value="3" min="1">
        <button onclick="removeColumn()">−</button>
        <button onclick="addColumn()">+</button>
    </div>
    <div id="grid"></div>
    <script>
        let columns = [
            { title: "Column 1", color: "lightblue" },
            { title: "Column 2", color: "lightblue" },
            { title: "Column 3", color: "lightblue" }
        ];
        function display() {

            let grid = document.getElementById("grid");
            grid.innerHTML = "";
            grid.style.gridTemplateColumns =
                "repeat(" + columns.length + ", 1fr)";
            columns.forEach(function(column, index) {
                let div = document.createElement("div");
                div.className = "column";
                div.draggable = true;
                div.style.backgroundColor = column.color;
                div.innerHTML = `
                    <h3>${column.title}</h3>
                    <p>Order: ${index + 1}</p>
                    <input type="number"
                           value="${index + 1}"
                           min="1"
                           max="${columns.length}"
                           onchange="changeOrder(${index}, this.value)">
                    <button onclick="edit(${index})">
                        Edit
                    </button>
                    <div id="edit${index}" class="edit">
                        <br>
                        <input type="text"
                               id="title${index}"
                               value="${column.title}">
                        <input type="text"
                               id="color${index}"
                               value="${column.color}">
                        <button onclick="save(${index})">
                            Save
                    </button>
                        <br>
                        <button onclick="setColor(${index}, 'lightblue')">
                            Blue
                        </button>
                        <button onclick="setColor(${index}, 'lightgreen')">
                            Green
                        </button>
                        <button onclick="setColor(${index}, 'lightpink')">
                            Pink
                        </button>
                    </div>
                `;
                div.ondragstart = function() {
                    dragged = index;
                };
                div.ondragover = function(event) {
                    event.preventDefault();
                };
                div.ondrop = function() {
                    let item = columns.splice(dragged, 1)[0];
                    columns.splice(index, 0, item);
                    display();
                };
                grid.appendChild(div);
            });
            document.getElementById("count").value =
                columns.length;
        }
        function addColumn() {
            columns.push({
                title: "Column " + (columns.length + 1),
                color: "lightblue"
            });
            display();
        }
        function removeColumn() {
            if (columns.length > 1) {
                columns.pop();
                display();
            }
        }
        document.getElementById("count").onchange = function() {
            let number = Number(this.value);
            if (number < 1)
                number = 1;
            while (columns.length < number) {
                addColumn();
            }
            while (columns.length > number) {
                columns.pop();
            }
            display();
        };
        function changeOrder(oldIndex, newIndex) {
            newIndex = Number(newIndex) - 1;
            let item = columns.splice(oldIndex, 1)[0];
            columns.splice(newIndex, 0, item);
            display();
        }
        function edit(index) {
            document.getElementById(
                "edit" + index
            ).classList.toggle("show");
        }
        function save(index) {
            let title = document.getElementById(
                "title" + index
            ).value;
            let color = document.getElementById(
                "color" + index
            ).value;
            columns[index].title = title;
            columns[index].color = color;
            display();
        }
        function setColor(index, color) {
            columns[index].color = color;
            display();
        }
        let dragged;
        display();
    </script>
</body>
</html>
