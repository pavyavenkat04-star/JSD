<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        #head1
        {
            background-color: red;
        }
        .c1
        {
            background-color: chartreuse; 
        }
        h1,h2,h3
        {
            background-color:pink;
        }
        #img1
        {
            border-radius:50%;
            border:5px solid blue;
            width:300px;
            height:auto;
        }
        #img2
        {
            border-radius: 20%;
            border:5px solid blue;
        }
       button
       {
        font-size:50px;
        background-color:gold;
        color:darkcyan;
        border-radius: 10px;
       }
       button:hover
       {
        font-size:55px;
        border:5px solid darkgray;
        background-color: darkcyan;
        color:gold;
        cursor:pointer;
       }
    </style>
</head>
<body>
    <h1 id="head1" class="c1">This is a header tag</h1>
    <h1>Header tag</h1>
    <h2>Header tag</h2>
    <h3>Header tag</h3>
    <button>Click Me</button><br>
    <img id="img1" src="./images/tulip.jpg" >
    <img id="img2" src="./images/tulip.jpg" >

    <img id="img4" src="./images/tulip.jpg" >

</html>
