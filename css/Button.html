<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type=""text/css">
    button
    {
        background-color: chocolate;
        color:honeydew;
        font-size: 30px;
        margin-right:60px;
        margin-top:20px;
        border:none;
        outline:none;
        padding:15px;
        border-radius: 15px;
    }
    button:hover
    {
        cursor:pointer;
        background-color: darksalmon;
        color:darkgreen;
    }
    #b1:hover
    {
        outline:3px solid green;
        border-radius: 0 25px 0 25px;
    }
    #b2:hover
    {
        outline:3px solid green;
        border-radius:25px 0 25px 0;
    }
    
    </style>
</head>
<body>
    <button id="b1">Home</button>
    <button id="b2">Services</button>
    <button id="b3">About</button>
    <button id="b4">Contact us</button>
</body>
</html>
