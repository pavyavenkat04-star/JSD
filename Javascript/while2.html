<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function loop()
        {
        var n1=parseInt(document.getElementById("t1").value);
        var n2=parseInt(document.getElementById("t2").value);
        var res="";
        var sum=0;
        do
        {sum=sum+n1;
            if(n1==n2)
            res=res+n1+"";
            else
            res=res+n1+"+";
            n1++;
        }while(n1<=n2);
        document.getElementById("ans").innerHTML=res+"="+sum;
        }
    </script>
</head>
<body>
    <h1><center>While Loop</center></h1>
    <input id="t1" type="text" placeholder="Enter start num"><br>
    <input id="t2" type="text" placeholder="Enter end num"><br>
    <input type="button" value="Click here" onclick="loop()">
    <div id="ans"></div>
</body>
</html>
