<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function display()
        {
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var res="";
            for(var i=n1; i<=n2; i++)
        {
            res=res+i+" ";
        } document.getElementById("ans").innerHTML=res;
        }
    </script>
</head>
<body>
    <h1><center>For Loop</center></h1>
    <input id="t1" type="text" placeholder="Enter start number">
    <br>
    <input id="t2" type="text" placeholder="Enter End number">
    <br>
    <input type="button" value="show answer" onclick="display()">
    <div id="ans"></div>
</body>
</html>
