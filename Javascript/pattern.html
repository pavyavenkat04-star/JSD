<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function dis()
        {
            var n=document.getElementById("t1").value;
            for(var i=1;i<=n;i++)
        {
            for (var j=1;j<=i;j++)
        {
            document.write(" * ");
        }document.write("<br>");
       }
        }
    </script>
</head>
<body>
    <input id="t1" type="number" placeholder="Enter a number"><br>
    <button onclick="dis()">nested loop</button>
</body>
</html>
