<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function order()
        {
            no=parseInt(document.getElementById("no").value);
            var arr=new Array(no);
             var arr2=new Array(no);
             var z=0;
            var ele=0;
             for (var i=0;i<no;i++)
             {
                arr[i]=parseInt(prompt("enter element "+i));
             }

            for (var i=0;i<no;i++)
        {ele=arr[i];
            for (var j=i+1;j<no;j++)
            {
            if (ele>arr[j])
            {
                ele=arr[j];
                arr[j]=arr[i];
            }
            else if(ele<arr[j])
            continue;
            }
            arr2[z]=ele;
            z++;
        }
        for (var i=0;i<no;i++)
        {
            document.write(arr2[i]+" ");
        }
    }
    </script>
</head>
<body>
    <h3><center>Ascending order</center></h3>
    <input type="text" id="no" placeholder="Enter array size">
    <br>
    <input type="button" value="sort" onclick="order()">
    <div id="n"></div>
</body>
</html>
