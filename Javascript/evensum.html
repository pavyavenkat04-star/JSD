<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function evensum()
        {var rem=0;
        var sum=0;
        var num=parseInt(document.getElementById("tb").value);
        while(num>0)
    {
        rem=num%10;
        num=Math.floor(num/10);
        if(rem%2==0)
        sum=sum+rem;
    }
      document.getElementById("op").innerHTML=sum;

        }
    </script>
</head>
<body>
    <h1><center>Sum of even nos</center></h1>
    <input id="tb" type="text" placeholder="Enter a number"><br>
    <button onclick="evensum()">sum of even's</button>
    <div id="op"></div>
</body>
</html>
