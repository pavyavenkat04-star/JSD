<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function display()
        {
            var n1=parseInt(document.getElementById("t1").value);
             var n2=parseInt(document.getElementById("t2").value);
             var res="";
             for(var i=n1;i<=n2;i++)
             {
                if (i>=15)
                break;
                else
                res=res+i+" ";
             }document.getElementById("ans").innerHTML=res;
        }
    </script>
</head>
<body>
    <h1><center>Jumping Statements 1.Continue 2.Break</center></h1>
    <input id="t1" type="text" placeholder="Enter a num"><br>
    <input id="t2" type="text" placeholder="Enter a num"><br>
    <input type="button" value="break test" onclick="display()">
    <div id="ans"></div>
    
</body>
</html>
