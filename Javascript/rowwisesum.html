<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var dis=()=>
        {  
            var arr=[[11,12,13],[47,28,40],[78,50,89]];
            var sum=0;
            for(var i=0;i<3;i++)
        {
            for (var j=0;j<3;j++)
        {
            sum=sum+arr[i][j];
            document.write(" "+arr[i][j]);
        }
        document.write("="+sum+"<br>");
        sum=0;
       }
        }
    </script>
</head>
<body>
    <button onclick="dis()">2-D array</button>
</body>
</html>
